name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.4.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write

jobs:
  check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/trad-data

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: crates/trad-data

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: crates/trad-data

      - name: Run tests
        run: cargo test
        working-directory: crates/trad-data

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            use-cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use-cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            use-cross: false

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/trad-data
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binary (native)
        if: matrix.use-cross == false
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: crates/trad-data

      - name: Build release binary (cross)
        if: matrix.use-cross == true
        run: cross build --release --target ${{ matrix.target }}
        working-directory: crates/trad-data

      - name: Prepare artifact (Unix)
        if: "!contains(matrix.target, 'windows')"
        run: |
          mkdir -p release
          cp crates/trad-data/target/${{ matrix.target }}/release/trad-data release/trad-data-${{ matrix.target }}
          chmod +x release/trad-data-${{ matrix.target }}

      - name: Prepare artifact (Windows)
        if: contains(matrix.target, 'windows')
        shell: bash
        run: |
          mkdir -p release
          cp crates/trad-data/target/${{ matrix.target }}/release/trad-data.exe release/trad-data-${{ matrix.target }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: release/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: bin-*
          merge-multiple: true
          path: artifacts

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          # Rename .exe files to include target in name
          for f in *; do
            echo "$(sha256sum "$f" | awk '{print $1}')  $f" >> ../SHA256SUMS.txt
          done
          cat ../SHA256SUMS.txt

      - name: Extract changelog
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          TAG="${TAG#v}"
          # Extract section for this version from CHANGELOG.md
          awk "/^## .*${TAG}/{found=1; next} /^## /{found=0} found{print}" CHANGELOG.md > release_notes.md
          # If no section found, use git log
          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for ${TAG}, using git log." > release_notes.md
            git log --oneline -20 >> release_notes.md
          fi

      - name: Build download table
        id: table
        run: |
          echo "## Downloads" > download_table.md
          echo "" >> download_table.md
          echo "| Platform | Architecture | Binary | SHA256 |" >> download_table.md
          echo "|----------|-------------|--------|--------|" >> download_table.md
          
          for f in artifacts/*; do
            fname=$(basename "$f")
            sha=$(grep "$fname" SHA256SUMS.txt | awk '{print $1}')
            
            # Parse target from filename
            target="${fname#trad-data-}"
            target="${target%.exe}"
            
            # Determine platform and arch
            if echo "$target" | grep -q "linux-musl"; then
              platform="Linux (musl)"
            elif echo "$target" | grep -q "linux-gnu"; then
              platform="Linux (glibc)"
            elif echo "$target" | grep -q "apple-darwin"; then
              platform="macOS"
            elif echo "$target" | grep -q "windows"; then
              platform="Windows"
            else
              platform="Unknown"
            fi
            
            if echo "$target" | grep -q "x86_64"; then
              arch="x86_64"
            elif echo "$target" | grep -q "aarch64"; then
              arch="aarch64"
            else
              arch="unknown"
            fi
            
            echo "| ${platform} | ${arch} | ${fname} | \`${sha}\` |" >> download_table.md
          done

      - name: Combine release notes
        run: |
          cat release_notes.md > full_notes.md
          echo "" >> full_notes.md
          cat download_table.md >> full_notes.md
          echo "" >> full_notes.md
          echo "## Checksums" >> full_notes.md
          echo '```' >> full_notes.md
          cat SHA256SUMS.txt >> full_notes.md
          echo '```' >> full_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: full_notes.md
          files: |
            artifacts/*
            SHA256SUMS.txt
          fail_on_unmatched_files: false

  npm-publish:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
