[package]
name = "trad-data"
version = "1.5.3"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.37"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
