[package]
name = "trad-data"
version = "1.9.1"
edition = "2021"
description = "TradingAgents skill: installer + data fetcher (Rust binary)"
license = "Apache-2.0"

[[bin]]
name = "trad-skill"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
serde = "1"
serde_json = "1"
quick-xml = "0.37"
chrono = "0.4"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
# 独立 CLI，无 catch_unwind：panic 直接 abort，进一步缩二进制
panic = "abort"
